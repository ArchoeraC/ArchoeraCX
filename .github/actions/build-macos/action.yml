name: Build ArchoeraCX (macOS)
description: >-
  macOS build: toolchain, native modules, C++/C#/Rust tests, Flutter tests,
  client-id identity verification, and the release .app bundle verification.
  Packaging (tar.gz + dmg) stays in the calling job.
inputs:
  arch:
    description: Expected native slice, arm64 or x64.
    required: false
    default: arm64
  client_id:
    description: Microsoft OAuth client id injected into the C# module.
    required: false
    default: ''
  require_client_id:
    description: '"1" on tagged releases; fail when client_id is empty.'
    required: false
    default: '0'
  require_official:
    description: '"1" on tagged releases; assert the official client-id digest.'
    required: false
    default: '0'
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        toolchain: stable

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: '3.47.7'
        cache: true

    - name: Validate Microsoft client id
      if: inputs.client_id != ''
      shell: bash
      env:
        ARCHOERACX_MICROSOFT_CLIENT_ID: ${{ inputs.client_id }}
      run: |
        set -euo pipefail
        if [[ ! "${ARCHOERACX_MICROSOFT_CLIENT_ID}" =~ ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$ ]]; then
          echo "::error::ARCHOERACX_MICROSOFT_CLIENT_ID is not a GUID (length ${#ARCHOERACX_MICROSOFT_CLIENT_ID}); refusing to build with a broken sign-in configuration."
          exit 1
        fi
        echo "Microsoft client id: configured (value not echoed)"

    - name: Require Microsoft client id for tagged builds
      if: inputs.require_client_id == '1'
      shell: bash
      env:
        ARCHOERACX_MICROSOFT_CLIENT_ID: ${{ inputs.client_id }}
      run: |
        if [[ -z "${ARCHOERACX_MICROSOFT_CLIENT_ID:-}" ]]; then
          echo "::error::ARCHOERACX_MICROSOFT_CLIENT_ID is not configured; refusing a tagged build without sign-in support."
          exit 1
        fi

    - name: Build native modules
      shell: bash
      working-directory: app
      env:
        ARCHOERACX_MICROSOFT_CLIENT_ID: ${{ inputs.client_id }}
      run: ./tool/build-native.sh

    - name: Verify build architecture
      shell: bash
      working-directory: app
      env:
        EXPECTED_ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        case "${EXPECTED_ARCH}" in
          arm64) expected="arm64" ;;
          x64) expected="x86_64" ;;
          *) echo "::error::unsupported macOS arch '${EXPECTED_ARCH}'"; exit 1 ;;
        esac
        host="$(uname -m)"
        [[ "${host}" == "${expected}" ]] || {
          echo "::error::runner is ${host}, expected ${expected} for the ${EXPECTED_ARCH} job"
          exit 1
        }
        # Flutter, NativeAOT, Cargo and CMake all build the host slice; verify
        # the modules before they are copied into the bundle so a wrong runner
        # label cannot produce a mislabeled package.
        for file in \
          build/native/libarchoera_core.dylib \
          build/native/libarchoera_cs.dylib \
          build/native/libarchoera_dl.dylib \
          build/native/archoera-dl \
          build/native/archoera-vault; do
          actual="$(lipo -archs "${file}")"
          [[ "${actual}" == "${expected}" ]] || {
            echo "::error::${file} is ${actual}, expected ${expected}"
            exit 1
          }
        done
        echo "native modules: ${expected}"

    - name: C++ ABI smoke tests
      shell: bash
      working-directory: app
      run: |
        set -euo pipefail
        ./build/native/abi_smoke
        ./build/native/async_smoke
        ./build/native/module_smoke
        ./build/native/event_queue_smoke

    - name: C# tests
      shell: bash
      working-directory: app
      run: dotnet test core/modules/business/Archoera.Tests/Archoera.Tests.csproj -c Release --nologo

    - name: C# DevHost diagnostics
      shell: bash
      working-directory: app
      run: |
        dotnet run --project core/modules/business/Archoera.DevHost -c Release -- --check
        dotnet run --project core/modules/business/Archoera.DevHost -c Release -- --self-test-loader

    - name: Rust tests
      shell: bash
      working-directory: app
      run: |
        cargo test --locked --manifest-path core/modules/downloader/Cargo.toml
        cargo test --locked --manifest-path core/vault-rs/Cargo.toml

    - name: Flutter dependencies and localization
      shell: bash
      working-directory: app
      run: |
        flutter pub get
        flutter gen-l10n

    - name: Dart analyze
      shell: bash
      working-directory: app
      run: dart analyze

    - name: Flutter tests
      shell: bash
      working-directory: app
      run: flutter test

    - name: Verify compiled Microsoft client id
      if: inputs.client_id != ''
      shell: bash
      working-directory: app
      env:
        ARCHOERACX_CLIENT_ID_TESTS: '1'
        ARCHOERACX_REQUIRE_OFFICIAL_BUILD: ${{ inputs.require_official }}
      run: flutter test test/client_id_integration_test.dart

    - name: Build Flutter macOS bundle
      shell: bash
      working-directory: app
      env:
        EXPECTED_ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        # Pin the target slice explicitly instead of relying on Flutter's
        # release default (universal, later arm64-only). The two jobs publish
        # separate arm64 and x64 packages, so a universal shell in either one
        # would let the wrong Mac launch natively and then fail to load the
        # other architecture's native modules.
        if [[ "${EXPECTED_ARCH}" == "arm64" ]]; then
          export FLUTTER_MACOS_ARM64_ONLY=true
        else
          # Keep the x64 target enabled even after Flutter flips the
          # arm64-only default; Stage 4 of Flutter's Intel deprecation will
          # make this build fail, which is the signal to drop macOS x64.
          export FLUTTER_MACOS_ARM64_ONLY=false
          export FLUTTER_XCODE_ARCHS=x86_64
        fi
        flutter build macos --release

    - name: Verify native slice
      shell: bash
      working-directory: app
      env:
        EXPECTED_ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        case "${EXPECTED_ARCH}" in
          arm64) expected="arm64" ;;
          x64) expected="x86_64" ;;
          *) echo "::error::unsupported macOS arch '${EXPECTED_ARCH}'"; exit 1 ;;
        esac
        app_path=build/macos/Build/Products/Release/archoera_cx.app
        native="${app_path}/Contents/Frameworks"
        for file in \
          libarchoera_core.dylib \
          libarchoera_cs.dylib \
          libe_sqlite3.dylib \
          libarchoera_dl.dylib \
          archoera-dl \
          archoera-vault; do
          [[ -f "${native}/${file}" ]] || { echo "::error::missing ${file}"; exit 1; }
        done
        exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app_path}/Contents/Info.plist")"
        # Both jobs force a single target slice, so the runner must match
        # exactly; a universal runner means the arch pinning silently stopped
        # working (for example after a Flutter upgrade).
        runner_archs="$(lipo -archs "${app_path}/Contents/MacOS/${exe}")"
        [[ "${runner_archs}" == "${expected}" ]] || {
          echo "::error::${app_path}/Contents/MacOS/${exe} is ${runner_archs}, expected ${expected}"
          exit 1
        }
        for file in "${native}/libarchoera_core.dylib" \
          "${native}/libarchoera_cs.dylib" "${native}/libe_sqlite3.dylib" \
          "${native}/libarchoera_dl.dylib" "${native}/archoera-dl" "${native}/archoera-vault"; do
          actual="$(lipo -archs "${file}")"
          [[ "${actual}" == "${expected}" ]] || {
            echo "::error::${file} is ${actual}, expected ${expected}"
            exit 1
          }
        done
        codesign --verify --deep --strict "${app_path}"
        python tool/check_icons.py \
          "${app_path}/Contents/Frameworks/App.framework/Resources/flutter_assets"
