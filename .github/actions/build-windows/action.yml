name: Build ArchoeraCX (Windows)
description: >-
  Windows build: toolchain, native modules, C++/C#/Rust tests, Flutter tests,
  client-id identity verification, and the release runner verification.
  Packaging (portable zip + Inno Setup installer) stays in the calling job.
inputs:
  client_id:
    description: Microsoft OAuth client id injected into the C# module.
    required: false
    default: ''
  require_client_id:
    description: '"1" on tagged releases; fail when client_id is empty.'
    required: false
    default: '0'
  require_official:
    description: '"1" on tagged releases; assert the official client-id digest.'
    required: false
    default: '0'
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        toolchain: stable

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: '3.47.7'
        cache: true

    - name: Validate Microsoft client id
      if: inputs.client_id != ''
      shell: bash
      env:
        ARCHOERACX_MICROSOFT_CLIENT_ID: ${{ inputs.client_id }}
      run: |
        set -euo pipefail
        if [[ ! "${ARCHOERACX_MICROSOFT_CLIENT_ID}" =~ ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$ ]]; then
          echo "::error::ARCHOERACX_MICROSOFT_CLIENT_ID is not a GUID (length ${#ARCHOERACX_MICROSOFT_CLIENT_ID}); refusing to build with a broken sign-in configuration."
          exit 1
        fi
        echo "Microsoft client id: configured (value not echoed)"

    - name: Require Microsoft client id for tagged builds
      if: inputs.require_client_id == '1'
      shell: bash
      env:
        ARCHOERACX_MICROSOFT_CLIENT_ID: ${{ inputs.client_id }}
      run: |
        if [[ -z "${ARCHOERACX_MICROSOFT_CLIENT_ID:-}" ]]; then
          echo "::error::ARCHOERACX_MICROSOFT_CLIENT_ID is not configured; refusing a tagged build without sign-in support."
          exit 1
        fi

    - name: Build native modules
      shell: pwsh
      working-directory: app
      env:
        ARCHOERACX_MICROSOFT_CLIENT_ID: ${{ inputs.client_id }}
      run: |
        # < NUL makes cmd's cancellation prompt read EOF instead of hanging.
        cmd /c "call tool\build-native.bat < NUL"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: C++ ABI smoke tests
      shell: bash
      working-directory: app
      run: |
        set -euo pipefail
        ./build/native/abi_smoke
        ./build/native/async_smoke
        ./build/native/module_smoke
        ./build/native/event_queue_smoke

    - name: C# tests
      shell: pwsh
      working-directory: app
      run: dotnet test modules/business/Archoera.Tests/Archoera.Tests.csproj -c Release --nologo

    - name: C# DevHost diagnostics
      shell: pwsh
      working-directory: app
      run: |
        dotnet run --project modules/business/Archoera.DevHost -c Release -- --check
        dotnet run --project modules/business/Archoera.DevHost -c Release -- --self-test-loader

    - name: Rust tests
      shell: pwsh
      working-directory: app
      run: |
        cargo test --locked --manifest-path modules/downloader/Cargo.toml
        cargo test --locked --manifest-path core/vault-rs/Cargo.toml

    - name: Flutter dependencies and localization
      shell: pwsh
      working-directory: app
      run: |
        pwsh -NoProfile -File tool/flutter.ps1 pub get
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        pwsh -NoProfile -File tool/flutter.ps1 gen-l10n
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Dart analyze
      shell: pwsh
      working-directory: app
      run: |
        $dart = Join-Path $env:FLUTTER_ROOT 'bin\cache\dart-sdk\bin\dart.exe'
        & $dart analyze
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Flutter tests
      shell: pwsh
      working-directory: app
      run: |
        pwsh -NoProfile -File tool/flutter.ps1 test
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify compiled Microsoft client id
      if: inputs.client_id != ''
      shell: pwsh
      working-directory: app
      env:
        ARCHOERACX_CLIENT_ID_TESTS: '1'
        ARCHOERACX_REQUIRE_OFFICIAL_BUILD: ${{ inputs.require_official }}
      run: |
        pwsh -NoProfile -File tool/flutter.ps1 test test/client_id_integration_test.dart
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build Flutter Windows bundle
      shell: pwsh
      working-directory: app
      run: |
        pwsh -NoProfile -File tool/flutter.ps1 build windows --release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify native slice
      shell: bash
      working-directory: app
      run: |
        set -euo pipefail
        bundle=build/windows/x64/runner/Release
        for file in \
          archoera_core.dll \
          archoera_cs.dll \
          e_sqlite3.dll \
          archoera_dl.dll \
          archoera-dl.exe \
          archoera-vault.exe; do
          [[ -f "${bundle}/${file}" ]] || { echo "::error::missing ${file}"; exit 1; }
        done
        python tool/check_icons.py "${bundle}/data/flutter_assets"
