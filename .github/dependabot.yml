version: 2

updates:
  - package-ecosystem: cargo
    directory: /app/modules/downloader
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      downloader:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /app/core/vault-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /app/modules/business
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
