# =====================================================================
#  Per-distribution build + packaging + tag release.
#
#  Each Linux distribution builds from source in its own environment; a bundle
#  produced on Ubuntu is not repackaged for Fedora/Arch/Deepin. AppImage,
#  Flatpak and Nix consume the Ubuntu bundle in separate jobs.
#
#  linux-deb      ubuntu-24.04 runner : tar.gz + ubuntu24.04 .deb + raw bundle
#  linux-deepin   Deepin 25 container : deepin25 .deb
#  linux-rpm      Fedora container    : fedora .rpm
#  linux-arch     Arch container      : arch .pkg.tar.zst
#  linux-appimage needs linux-deb     : .AppImage
#  linux-flatpak  needs linux-deb     : .flatpak
#  linux-nix      needs linux-deb     : NixOS store output (.tar.gz)
#  macos          macOS runner        : .tar.gz + .dmg
#  windows        Windows runner      : portable .zip + Inno Setup installer
#  release        needs all 9         : tag v* only
#
#  Source builds use .github/actions/build-{linux,macos,windows} and receive
#  the Microsoft client id from the repository secret. Tag builds require the
#  secret and assert the official build identity. No release signatures are
#  produced.
# =====================================================================
name: Build all platforms & release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: 'macOS arm64'
        type: boolean
        default: true
      windows:
        description: 'Windows x64'
        type: boolean
        default: true
      linux_deb:
        description: 'Ubuntu 24.04 tar.gz + .deb'
        type: boolean
        default: true
      linux_deepin:
        description: 'Deepin 25 .deb'
        type: boolean
        default: true
      linux_rpm:
        description: 'Fedora .rpm'
        type: boolean
        default: true
      linux_arch:
        description: 'Arch .pkg.tar.zst'
        type: boolean
        default: true
      linux_appimage:
        description: 'AppImage (auto-selects linux_deb)'
        type: boolean
        default: true
      linux_flatpak:
        description: 'Flatpak (auto-selects linux_deb)'
        type: boolean
        default: true
      linux_nix:
        description: 'NixOS package (auto-selects linux_deb)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # =====================================================================
  #  preflight: menu -> individual switches. A tag ignores the menu and
  #  selects all nine; release is allowed only when all nine ran.
  # =====================================================================
  preflight:
    name: Preflight (platform selection)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.select.outputs.version }}
      all_selected: ${{ steps.select.outputs.all_selected }}
      macos: ${{ steps.select.outputs.macos }}
      windows: ${{ steps.select.outputs.windows }}
      linux_deb: ${{ steps.select.outputs.linux_deb }}
      linux_deepin: ${{ steps.select.outputs.linux_deepin }}
      linux_rpm: ${{ steps.select.outputs.linux_rpm }}
      linux_arch: ${{ steps.select.outputs.linux_arch }}
      linux_appimage: ${{ steps.select.outputs.linux_appimage }}
      linux_flatpak: ${{ steps.select.outputs.linux_flatpak }}
      linux_nix: ${{ steps.select.outputs.linux_nix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_MACOS: ${{ inputs.macos }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_LINUX_DEB: ${{ inputs.linux_deb }}
          IN_LINUX_DEEPIN: ${{ inputs.linux_deepin }}
          IN_LINUX_RPM: ${{ inputs.linux_rpm }}
          IN_LINUX_ARCH: ${{ inputs.linux_arch }}
          IN_LINUX_APPIMAGE: ${{ inputs.linux_appimage }}
          IN_LINUX_FLATPAK: ${{ inputs.linux_flatpak }}
          IN_LINUX_NIX: ${{ inputs.linux_nix }}
        run: |
          set -euo pipefail
          truthy() { case "${1:-}" in true|TRUE|True|1|yes|YES) echo true ;; *) echo false ;; esac; }

          if [[ "${REF}" == refs/tags/* || "${EVENT}" == push || "${EVENT}" == pull_request ]]; then
            # Tags and normal CI runs cover all nine; only workflow_dispatch is
            # a menu.
            MACOS=true; WINDOWS=true; DEB=true; DEEPIN=true; RPM=true
            ARCH=true; APPIMAGE=true; FLATPAK=true; NIX=true
          else
            MACOS=$(truthy "${IN_MACOS}"); WINDOWS=$(truthy "${IN_WINDOWS}")
            DEB=$(truthy "${IN_LINUX_DEB}"); DEEPIN=$(truthy "${IN_LINUX_DEEPIN}")
            RPM=$(truthy "${IN_LINUX_RPM}"); ARCH=$(truthy "${IN_LINUX_ARCH}")
            APPIMAGE=$(truthy "${IN_LINUX_APPIMAGE}"); FLATPAK=$(truthy "${IN_LINUX_FLATPAK}")
            NIX=$(truthy "${IN_LINUX_NIX}")
          fi

          # AppImage, Flatpak and Nix consume the Ubuntu bundle.
          if [[ "${APPIMAGE}" == true || "${FLATPAK}" == true || "${NIX}" == true ]]; then
            DEB=true
          fi

          VERSION="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -n 1)"
          [[ -n "${VERSION}" ]] || { echo "::error::could not read version from app/pubspec.yaml"; exit 1; }
          if [[ "${REF}" == refs/tags/* && "${REF#refs/tags/v}" != "${VERSION}" ]]; then
            echo "::warning::tag ${REF#refs/tags/} does not match app/pubspec.yaml ${VERSION}"
          fi

          ALL=false
          if [[ "${MACOS}" == true && "${WINDOWS}" == true && "${DEB}" == true \
             && "${DEEPIN}" == true && "${RPM}" == true && "${ARCH}" == true \
             && "${APPIMAGE}" == true && "${FLATPAK}" == true && "${NIX}" == true ]]; then
            ALL=true
          fi

          {
            echo "version=${VERSION}"
            echo "all_selected=${ALL}"
            echo "macos=${MACOS}"
            echo "windows=${WINDOWS}"
            echo "linux_deb=${DEB}"
            echo "linux_deepin=${DEEPIN}"
            echo "linux_rpm=${RPM}"
            echo "linux_arch=${ARCH}"
            echo "linux_appimage=${APPIMAGE}"
            echo "linux_flatpak=${FLATPAK}"
            echo "linux_nix=${NIX}"
          } >> "$GITHUB_OUTPUT"

          echo "menu: macos=${MACOS} windows=${WINDOWS} deb=${DEB} deepin=${DEEPIN} rpm=${RPM} arch=${ARCH} appimage=${APPIMAGE} flatpak=${FLATPAK} nix=${NIX}"

  # =====================================================================
  #  macOS: source build + tar.gz/dmg packaging.
  # =====================================================================
  macos:
    name: macOS arm64
    needs: preflight
    if: needs.preflight.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/build-macos
        with:
          client_id: ${{ secrets.ARCHOERACX_MICROSOFT_CLIENT_ID }}
          require_client_id: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          require_official: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: Package macOS (tar.gz + dmg)
        shell: bash
        run: |
          bash packaging/macos/package.sh all \
            app/build/macos/Build/Products/Release/archoera_cx.app \
            "${{ needs.preflight.outputs.version }}" arm64
      - name: Verify package outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.dmg)
          (( ${#files[@]} > 0 )) || { echo "::error::no macOS package was produced"; exit 1; }
          for f in "${files[@]}"; do [[ -s "$f" ]] || { echo "::error::empty package: $f"; exit 1; }; done
          ls -lh dist
      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-macos
          path: dist/*
          if-no-files-found: error

  # =====================================================================
  #  Windows: source build + portable zip/installer packaging.
  # =====================================================================
  windows:
    name: Windows x64
    needs: preflight
    if: needs.preflight.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/build-windows
        with:
          client_id: ${{ secrets.ARCHOERACX_MICROSOFT_CLIENT_ID }}
          require_client_id: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          require_official: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Package Windows (zip + installer)
        shell: pwsh
        run: |
          pwsh packaging/windows/package.ps1 `
            -ReleaseDir app/build/windows/x64/runner/Release `
            -Version "${{ needs.preflight.outputs.version }}" `
            -Arch x64 `
            -Installer
      - name: Verify package outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip dist/*.exe)
          (( ${#files[@]} > 0 )) || { echo "::error::no Windows package was produced"; exit 1; }
          for f in "${files[@]}"; do [[ -s "$f" ]] || { echo "::error::empty package: $f"; exit 1; }; done
          ls -lh dist
      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-windows
          path: dist/*
          if-no-files-found: error

  # =====================================================================
  #  Ubuntu 24.04: source build -> tar.gz + .deb + raw bundle.
  # =====================================================================
  linux-deb:
    name: Linux deb (Ubuntu 24.04)
    needs: preflight
    if: needs.preflight.outputs.linux_deb == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils clang cmake ninja-build pkg-config patchelf file \
            libgtk-3-dev libdbus-1-dev liblzma-dev libdrm-dev libglu1-mesa-dev \
            libx11-dev libxi-dev musl-tools python3 zlib1g-dev
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/build-linux
        with:
          client_id: ${{ secrets.ARCHOERACX_MICROSOFT_CLIENT_ID }}
          require_client_id: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          require_official: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: C# tests
        working-directory: app
        run: dotnet test modules/business/Archoera.Tests/Archoera.Tests.csproj -c Release --nologo
      - name: C# DevHost diagnostics
        working-directory: app
        run: |
          dotnet run --project modules/business/Archoera.DevHost -c Release -- --check
          dotnet run --project modules/business/Archoera.DevHost -c Release -- --self-test-loader
      - name: Rust tests
        working-directory: app
        run: |
          cargo test --locked --manifest-path modules/downloader/Cargo.toml
          cargo test --locked --manifest-path core/vault-rs/Cargo.toml
      - name: Package tar.gz + deb
        shell: bash
        env:
          DISTRO_TAG: ubuntu24.04
          BUILD_BASE: Ubuntu 24.04
        run: |
          bash packaging/linux/package.sh tar app/build/linux/x64/release/bundle \
            "${{ needs.preflight.outputs.version }}" x64
          bash packaging/linux/package.sh deb app/build/linux/x64/release/bundle \
            "${{ needs.preflight.outputs.version }}" x64
          ls -lh dist
      - name: Upload raw bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-bundle
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error
      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-deb
          path: dist/*
          if-no-files-found: error

  # =====================================================================
  #  Deepin 25: source build inside the distro container (glibc 2.38).
  # =====================================================================
  linux-deepin:
    name: Linux deb (Deepin 25)
    needs: preflight
    if: needs.preflight.outputs.linux_deepin == 'true'
    runs-on: ubuntu-24.04
    container: linuxdeepin/deepin:25
    timeout-minutes: 90
    steps:
      - name: Install system dependencies
        run: |
          echo "deb https://community-packages.deepin.com/beige/ crimson main commercial community" > /etc/apt/sources.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates build-essential binutils clang cmake ninja-build pkg-config \
            patchelf file git curl wget xz-utils unzip zip jq \
            libgtk-3-dev libdbus-1-dev liblzma-dev libdrm-dev libglu1-mesa-dev \
            libx11-dev libxi-dev libicu-dev libssl-dev musl-tools python3 zlib1g-dev sudo
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Git safe directory
        run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/build-linux
        with:
          client_id: ${{ secrets.ARCHOERACX_MICROSOFT_CLIENT_ID }}
          require_client_id: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          require_official: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: Package deb
        shell: bash
        env:
          DISTRO_TAG: deepin25
          BUILD_BASE: Deepin 25 (glibc 2.38)
          DISTRO_NOTE: Deepin 25+ (glibc 2.38)
        run: |
          bash packaging/linux/package.sh deb app/build/linux/x64/release/bundle \
            "${{ needs.preflight.outputs.version }}" x64
          ls -lh dist
      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-deepin
          path: dist/*
          if-no-files-found: error

  # =====================================================================
  #  Fedora: source build inside the distro container.
  # =====================================================================
  linux-rpm:
    name: Linux rpm (Fedora)
    needs: preflight
    if: needs.preflight.outputs.linux_rpm == 'true'
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 90
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git curl wget tar xz zstd unzip zip which findutils file ca-certificates \
            gcc gcc-c++ clang cmake ninja-build pkgconf-pkg-config make patchelf binutils \
            zlib-devel gtk3-devel dbus-devel xz-devel libdrm-devel mesa-libGL-devel \
            libX11-devel libXi-devel libstdc++-devel libicu openssl-libs \
            musl-gcc musl-devel python3 rpm-build coreutils sed gawk
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Git safe directory
        run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/build-linux
        with:
          client_id: ${{ secrets.ARCHOERACX_MICROSOFT_CLIENT_ID }}
          require_client_id: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          require_official: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: Package rpm
        shell: bash
        env:
          DISTRO_TAG: fedora
          BUILD_BASE: Fedora (glibc from the container)
        run: |
          bash packaging/linux/package.sh rpm app/build/linux/x64/release/bundle \
            "${{ needs.preflight.outputs.version }}" x64
          ls -lh dist
      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-rpm
          path: dist/*
          if-no-files-found: error

  # =====================================================================
  #  Arch Linux: source build inside the distro container.
  # =====================================================================
  linux-arch:
    name: Linux pkg.tar.zst (Arch)
    needs: preflight
    if: needs.preflight.outputs.linux_arch == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - name: Install system dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel fakeroot shadow debugedit bzip2 gettext gnupg ncurses \
            git curl wget tar xz zstd unzip zip which findutils file libarchive \
            clang cmake ninja pkgconf patchelf binutils zlib gtk3 dbus xz \
            libdrm mesa libx11 libxi musl python
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Git safe directory
        run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/build-linux
        with:
          client_id: ${{ secrets.ARCHOERACX_MICROSOFT_CLIENT_ID }}
          require_client_id: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          require_official: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: Package Arch pkg.tar.zst
        shell: bash
        env:
          DISTRO_TAG: arch
          BUILD_BASE: Arch Linux (glibc from the container)
        run: |
          set -euo pipefail
          bash packaging/linux/package.sh arch app/build/linux/x64/release/bundle \
            "${{ needs.preflight.outputs.version }}" x64
          chown -R nobody:nobody packaging/linux/work/arch
          chage -E -1 nobody
          su nobody -s /bin/bash -c \
            'cd packaging/linux/work/arch && HOME=/tmp makepkg -f --skipinteg --nocheck --nodeps'
          mkdir -p dist
          src="$(find packaging/linux/work/arch -maxdepth 1 -name '*.pkg.tar.zst' | head -1)"
          [[ -n "${src}" ]] || { echo "::error::makepkg produced no package"; exit 1; }
          cp "${src}" "dist/ArchoeraCX-${{ needs.preflight.outputs.version }}-arch-x64.pkg.tar.zst"
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist
      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-arch
          path: dist/*
          if-no-files-found: error

  # =====================================================================
  #  AppImage: consumes the Ubuntu bundle; linuxdeploy collects the GTK/X11
  #  closure so the image is portable across distributions.
  # =====================================================================
  linux-appimage:
    name: Linux AppImage
    needs: [preflight, linux-deb]
    if: needs.preflight.outputs.linux_appimage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install AppImage tooling
        shell: bash
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/appimage-tools"
          mkdir -p "${tools}"
          curl --retry 3 --retry-delay 2 -fsSL \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o "${tools}/appimagetool"
          curl --retry 3 --retry-delay 2 -fsSL \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -o "${tools}/linuxdeploy"
          curl --retry 3 --retry-delay 2 -fsSL \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" -o "${tools}/runtime-x86_64"
          chmod 0755 "${tools}/appimagetool" "${tools}/linuxdeploy"
          echo "${tools}" >> "$GITHUB_PATH"
          {
            echo "LINUXDEPLOY=${tools}/linuxdeploy"
            echo "APPIMAGE_RUNTIME_FILE=${tools}/runtime-x86_64"
            echo "APPIMAGE_EXTRACT_AND_RUN=1"
          } >> "$GITHUB_ENV"
      - name: Download Linux bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-bundle
          path: bundle
      - name: Package AppImage
        shell: bash
        env:
          DISTRO_TAG: linux
          BUILD_BASE: Ubuntu 24.04
        run: |
          bash packaging/linux/package.sh appimage "$PWD/bundle" \
            "${{ needs.preflight.outputs.version }}" x64
          ls -lh dist
      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-appimage
          path: dist/*
          if-no-files-found: error

  # =====================================================================
  #  Flatpak: wraps the Ubuntu bundle.
  # =====================================================================
  linux-flatpak:
    name: Linux Flatpak
    needs: [preflight, linux-deb]
    if: needs.preflight.outputs.linux_flatpak == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak file
      - name: Download Linux bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-bundle
          path: bundle
      - name: Package Flatpak
        shell: bash
        run: |
          bash packaging/linux/package-flatpak.sh \
            "$PWD/bundle" "${{ needs.preflight.outputs.version }}" x64
          ls -lh dist
      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-flatpak
          path: dist/*
          if-no-files-found: error

  # =====================================================================
  #  NixOS: wraps the Ubuntu bundle with autoPatchelfHook.
  # =====================================================================
  linux-nix:
    name: Linux NixOS
    needs: [preflight, linux-deb]
    if: needs.preflight.outputs.linux_nix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
        with:
          extra-conf: |
            sandbox = false
            substituters = https://cache.nixos.org
      - name: Download Linux bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-bundle
          path: bundle
      - name: Stage Nix package
        shell: bash
        env:
          DISTRO_TAG: nixos
          BUILD_BASE: Ubuntu 24.04 (NixOS autoPatchelf)
        run: |
          bash packaging/linux/package.sh nix "$PWD/bundle" \
            "${{ needs.preflight.outputs.version }}" x64
      - name: Build Nix package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/nix-package"
          cp -a packaging/linux/work/nix "$RUNNER_TEMP/nix-package"
          cd "$RUNNER_TEMP/nix-package"
          nix build "path:$PWD#default" --option sandbox false --print-build-logs
      - name: Package Nix result
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/ArchoeraCX-${{ needs.preflight.outputs.version }}-nixos-x64.tar.gz" \
            -C "$RUNNER_TEMP/nix-package/result" .
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist
      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraCX-${{ needs.preflight.outputs.version }}-linux-nix
          path: dist/*
          if-no-files-found: error

  # =====================================================================
  #  release: tag v* only; all nine selections are required.
  # =====================================================================
  release:
    name: Release ${{ github.ref_name }}
    needs:
      - preflight
      - macos
      - windows
      - linux-deb
      - linux-deepin
      - linux-rpm
      - linux-arch
      - linux-appimage
      - linux-flatpak
      - linux-nix
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.preflight.outputs.all_selected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reject tags that are not on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status 2>/dev/null || echo error)"
          echo "compare main...${GITHUB_SHA} => ${status}"
          case "${status}" in
            behind|identical) echo "OK: tag commit is on main" ;;
            *) echo "::error::release tag must point at a commit on main (SEC-23)"; exit 1 ;;
          esac
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.pkg.tar.zst' -o -name '*.dmg' -o -name '*.AppImage' \
               -o -name '*.flatpak' -o -name '*.exe' -o -name '*.sha256' \
               -o -name 'SHA256SUMS' \) \
            -exec cp -v {} assets/ \;
          (
            cd assets
            shopt -s nullglob
            packages=(./*.tar.gz ./*.zip ./*.deb ./*.rpm ./*.pkg.tar.zst ./*.dmg ./*.AppImage ./*.flatpak ./*.exe)
            (( ${#packages[@]} > 0 )) || { echo "::error::no release packages were assembled"; exit 1; }
            sha256sum "${packages[@]}" > SHA256SUMS
          )
          ls -la assets
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NOTES="release-notes.md"
          {
            echo "ArchoeraCX ${VER}"
            echo
            echo "Development build for Linux x64, macOS arm64 and Windows x64."
            echo
            echo "- Linux: Ubuntu 24.04 tar.gz/.deb, Deepin 25 .deb, Fedora .rpm, Arch .pkg.tar.zst."
            echo "- Linux: portable .AppImage, .flatpak, NixOS store output."
            echo "- macOS: .dmg plus a .tar.gz containing the ad-hoc signed .app bundle."
            echo "- Windows: Inno Setup installer plus a portable .zip."
            echo "- Checksums: SHA256SUMS."
            echo
            echo "The Microsoft client id is injected at compile time from the"
            echo "repository secret; tag builds assert the official build identity."
          } > "${NOTES}"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file "${NOTES}"
            gh release upload "${TAG}" assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ArchoeraCX ${VER}" \
              --notes-file "${NOTES}"
          fi
