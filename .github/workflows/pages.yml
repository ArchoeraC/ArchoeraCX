# =====================================================================
#  Project site -> GitHub Pages.
#
#  `site/` is a self-contained static page (no build step, no package
#  manager), so the job only checks the version stamp and uploads the folder.
#  Deployment runs from Actions because the site lives outside the two paths
#  a branch source is allowed to serve (`/` and `/docs`).
# =====================================================================
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version stamp
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -n 1 | tr -d '[:space:]')"
          stamp="<span data-app-version>${version}</span>"
          total="$(grep -c 'data-app-version' site/index.html || true)"
          current="$(grep -c -F "${stamp}" site/index.html || true)"
          if [ "${total}" = "0" ] || [ "${total}" != "${current}" ]; then
            echo "site/index.html is not stamped with ${version}; run site/tool/sync-version.sh" >&2
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
