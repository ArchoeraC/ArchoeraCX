[package]
name = "archoera-vault"
version = "0.0.1+1"
edition = "2021"
description = "ArchoeraCX 凭据保险库（Rust，AGPL-3.0-or-later）"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "archoera-vault"
path = "src/main.rs"

[features]
default = []
# 测试构建标记（等价 C# VAULT_TESTING）：--version / 握手上报 TEST 标记。
vault_testing = []

[dependencies]
# 纯 Rust 加密栈（无 OpenSSL），保证 crt-static / musl 静态链接成立。
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = "1"
getrandom = "0.4"
base64 = "0.22"
libc = "0.2"

# ── 平台专属依赖（仅对应目标编译；Linux 依赖集保持不变，纯 Rust / 无 OpenSSL）──
# Windows：DPAPI（CryptProtectData/UnprotectData）+ 进程护栏
# （NtQueryInformationProcess / OpenProcess / QueryFullProcessImageNameW /
#  SetProcessMitigationPolicy / GetExitCodeProcess）+ 内存锁
# （VirtualLock/VirtualUnlock + SetProcessWorkingSetSize；见 src/memguard.rs）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

# macOS：Keychain（kSecClassGenericPassword，经 security-framework 的通用密码封装）。
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
