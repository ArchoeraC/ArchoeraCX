[package]
name = "archoera-dl"
version = "0.0.1+1"
edition = "2024"
rust-version = "1.85"
description = "DownloadPlan executor for ArchoeraCX (bytes -> files)"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "archoera_dl"
crate-type = ["cdylib", "rlib"]

[[bin]]
# The packaged CLI stays `archoera-dl`; this target name avoids Cargo's Windows
# PDB collision with the `archoera_dl` cdylib (both normalize to the same
# filename). build-dl.sh/.bat rename the artifact when installing it.
name = "archoera-dl-cli"
path = "src/bin/archoera_dl.rs"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "default-tls",
    "charset",
    "http2",
    "system-proxy",
    "socks",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
