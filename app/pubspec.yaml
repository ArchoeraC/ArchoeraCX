name: archoera_cx
description: "ArchoeraCX — cross-platform Minecraft: Java Edition launcher."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.5

dependencies:
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.6
  tray_manager: ^0.8.0
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets widget tests fake the OS file picker (see instances_pack_import_test).
  file_selector_platform_interface: ^2.7.0

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/transition.frag
    - shaders/glow.frag
  assets:
    - assets/branding/archoera_icon_256.png
    - assets/branding/tray_icon.png
    - assets/skins/default-offline.png
    - assets/icons/loaders/vanilla.png
    - assets/icons/loaders/fabric.png
    - assets/icons/loaders/quilt.png
    - assets/icons/loaders/forge.png
    - assets/icons/loaders/neoforge.png
    - assets/licenses/Tabler-Icons-MIT.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Medium.otf
          weight: 500
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf
