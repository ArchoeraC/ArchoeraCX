name: archoera_cx
description: "ArchoeraCX — cross-platform Minecraft: Java Edition launcher."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.5

dependencies:
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/archoera_icon_256.png
    - assets/skins/default-offline.png
    - assets/icons/loaders/vanilla.png
    - assets/icons/loaders/fabric.png
    - assets/icons/loaders/quilt.png
    - assets/icons/loaders/forge.png
    - assets/icons/loaders/neoforge.png
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Medium.otf
          weight: 500
