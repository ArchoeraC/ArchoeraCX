# DRAFT ONLY — intentionally kept outside .github/workflows.
# The new GitHub repository is not running Actions until the maintainer enables it.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            libsqlite3-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Build C++ core
        working-directory: app
        run: ./tool/build-core.sh

      - name: Build C# module
        working-directory: app
        env:
          ARCHOERACX_MICROSOFT_CLIENT_ID: ${{ secrets.ARCHOERACX_MICROSOFT_CLIENT_ID }}
        run: ./tool/build-cs.sh

      - name: Build Rust downloader
        working-directory: app
        run: ./tool/build-dl.sh

      - name: Build credential vault
        working-directory: app
        run: ./tool/build-vault.sh

      - name: C++ smoke tests
        working-directory: app
        run: |
          ./build/native/abi_smoke
          ./build/native/async_smoke
          ./build/native/module_smoke

      - name: C# tests
        working-directory: app
        run: dotnet test modules/business/Archoera.Tests/Archoera.Tests.csproj -c Release --nologo

      - name: C# DevHost diagnostics
        working-directory: app
        run: |
          dotnet run --project modules/business/Archoera.DevHost -c Release -- --check
          dotnet run --project modules/business/Archoera.DevHost -c Release -- --self-test-loader

      - name: Rust tests
        run: cargo test --manifest-path app/modules/downloader/Cargo.toml --locked

      - name: Flutter dependencies and localization
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Dart analyze
        working-directory: app
        run: dart analyze

      - name: Flutter tests
        working-directory: app
        run: flutter test

      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release

      - name: Verify relocatable native bundle
        working-directory: app
        run: |
          test -f build/linux/x64/release/bundle/lib/libarchoera_core.so
          test -f build/linux/x64/release/bundle/lib/archoera_cs.so
          test -x build/linux/x64/release/bundle/lib/archoera-dl
          test -x build/linux/x64/release/bundle/lib/archoera-vault

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: archoera-cx-linux-x64
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 7
