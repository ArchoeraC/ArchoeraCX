# DRAFT ONLY — not active until the maintainer explicitly enables GitHub Actions.
# Keep this file outside .github/workflows so a push to the new repository does
# not start a release build or publish anything.

name: GitHub dev release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.0.1-alpha.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x64 GitHub pre-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            libsqlite3-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Build C++ core
        working-directory: app
        run: ./tool/build-core.sh

      - name: Build C# module with release secret
        working-directory: app
        env:
          # Build-time only. Never write this value to a source file or log.
          ARCHOERACX_MICROSOFT_CLIENT_ID: ${{ secrets.ARCHOERACX_MICROSOFT_CLIENT_ID }}
          # Future CurseForge support will use the same CI-only pattern:
          # ARCHOERACX_CURSEFORGE_API_KEY: ${{ secrets.ARCHOERACX_CURSEFORGE_API_KEY }}
        run: |
          if [[ -z "${ARCHOERACX_MICROSOFT_CLIENT_ID}" ]]; then
            echo "::error::ARCHOERACX_MICROSOFT_CLIENT_ID is not configured"
            exit 1
          fi
          ./tool/build-cs.sh

      - name: Build Rust downloader
        working-directory: app
        run: ./tool/build-dl.sh

      - name: Build credential vault
        working-directory: app
        run: ./tool/build-vault.sh

      - name: Flutter dependencies and tests
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n
          dart analyze
          flutter test

      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release

      - name: Package release
        run: |
          set -euo pipefail
          mkdir -p dist/archoera-cx-linux-x64/licenses
          cp -a app/build/linux/x64/release/bundle/. dist/archoera-cx-linux-x64/
          cp README.md LICENSE PRIVACY.md THIRD-PARTY-NOTICES.md dist/archoera-cx-linux-x64/
          cp app/assets/fonts/OFL.txt dist/archoera-cx-linux-x64/licenses/
          cp app/assets/icons/loaders/LICENSE-* dist/archoera-cx-linux-x64/licenses/
          tar -C dist -czf "archoera-cx-linux-x64.tar.gz" archoera-cx-linux-x64
          sha256sum "archoera-cx-linux-x64.tar.gz" > "archoera-cx-linux-x64.tar.gz.sha256"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ArchoeraCX ${{ inputs.tag || github.ref_name }} (development)
          prerelease: true
          generate_release_notes: true
          body: |
            **Development build / 开发版**

            This is an incomplete GitHub-only alpha. It may corrupt instances or
            configuration data. Do not use it for production or important data.

            这是功能不完整的 GitHub-only 开发版，可能损坏实例或配置数据；请勿用于正式环境或重要实例。

            - Online launch / Entitlement verification is not complete.
            - 在线启动 / Entitlement 校验尚未完成。
            - This is not an official Minecraft product and is not affiliated with Mojang or Microsoft.
            - 非官方 Minecraft 产品，与 Mojang、Microsoft 无关联。
          files: |
            archoera-cx-linux-x64.tar.gz
            archoera-cx-linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
